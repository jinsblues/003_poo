<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Poo</title>
        <!-- 매니페스트 파일 연결 -->
    <link rel="manifest" href="manifest.json">
    <!-- 아이폰 바탕화면 아이콘 강제 설정 (핵심) -->
    <link rel="apple-touch-icon" href="poo.png">

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 똥과 글자가 생성될 전체 화면 영역 -->
    <div id="app-container"></div>

    <!-- 하단 UI 정보창 -->
    <div id="info-panel">
        <div id="time-display">Time: <span id="time-count">00:00:00</span></div>
        <div id="touch-display">Hit: <span id="hit-count">0</span></div>
    </div>

    <!-- 게임 클리어 시 나타날 축하 메시지 컨테이너 -->
    <div id="win-message"></div>

    <script src="app.js"></script>
</body>
</html>
